name: secrets test

on: 
  workflow_dispatch: 

jobs:
  secrets-tests:
    runs-on: ubuntu-latest

    steps:
      - name: check if secret is set
        env:
          MY_SECRET: ${{ secrets.MY_SECRET_MESSAGE }}
        run: |
          if [ -n "$MY_SECRET"]; then
          echo "Secret is set"
          else
          echo "Secret is not set"
          fi
