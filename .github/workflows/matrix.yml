name: Matrix

on: 
  workflow_dispatch: 

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
          python-versions: ["3.10", "3.11", "3.12"]
          os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print python version
        run: python-version
        
