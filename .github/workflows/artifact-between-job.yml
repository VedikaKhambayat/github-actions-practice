name: Artifact Between Jobs

on:
  workflow_dispatch:

jobs:

  # Job 1: Generate and upload
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate file
        run: |
          echo "Hello from Job 1!" > message.txt
          echo "This file was generated by the generate job." >> message.txt
          echo "Artifact transfer successful!" >> message.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: job1-file
          path: message.txt


  # Job 2: Download and use
  consume:
    needs: generate
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: job1-file

      - name: Print file contents
        run: |
          echo "Contents of the artifact:"
          cat message.txt
