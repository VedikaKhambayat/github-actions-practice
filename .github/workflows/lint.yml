name: Auto linter

on:
  push: 
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
    # this step will automatically clone the code of current branch into the runner
      - name: clone the code
        run: actions/checkout@v7
        
    # this step will install the linter tool
      - name: install linter
        run: pip install ruff
