name: Auto linter

on:
  push: 
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
    # this step will automatically clone the code of current branch into the runner
      - name: clone the code
        uses: actions/checkout@v7

    # this step will intall python

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        
    # this step will install the linter tool
      - name: install linter
        run: pip install ruff
    # this step will run the linter
      - name: Check the files for linting
        run: ruff check .
